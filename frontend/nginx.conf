# EsnafDefter frontend: statik dosyalar + /api isteklerini backend'e yönlendirme.
# nginx-unprivileged imajı root olmayan kullanıcıyla ve 8080 portunda çalışır.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "same-origin" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'self'; connect-src 'self'; frame-ancestors 'none'" always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location /api/ {
        proxy_pass http://api:8080/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 60s;
    }

    # Swagger UI satır içi stil kullandığı için yalnızca /docs/ altında style-src gevşetilir.
    # NOT: nginx'te bir location içinde add_header kullanılırsa üst seviyedeki add_header'lar DEVRALINMAZ;
    # bu yüzden burada tüm güvenlik başlıkları yeniden yazılıyor. Diğer konumlarda önbellek için
    # add_header değil `expires -1` (=> "Cache-Control: no-cache") kullanılır, böylece güvenlik başlıkları korunur.
    location /docs/ {
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "same-origin" always;
        add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'; frame-ancestors 'none'" always;
        try_files $uri $uri/index.html =404;
    }

    location = /index.html { expires -1; }
    location /js/  { expires -1; try_files $uri =404; }
    location /css/ { expires -1; try_files $uri =404; }

    location / {
        try_files $uri /index.html;
    }
}
